version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gria_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gria_db
    ports:
      - "5432:5432"
    shm_size: '256mb'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
